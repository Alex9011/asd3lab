<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <script src="./node_modules/seedrandom/seedrandom.min.js"></script>
  <title>Обхід графа - Лабораторна 5</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>Лабораторна робота №5. Обхід графа</h1>

  <div class="controls">
    <button id="startBfs">Почати BFS</button>
    <button id="nextStep">Наступний крок</button>
    <button id="startDfs">Почати DFS</button>
    <button id="resetRun">Скинути</button>
  </div>

  <div class="container">
    <div class="graph-section">
      <h2>Граф</h2>
      <div id="runLabel" class="run-label"></div>
      <div class="legend">
        <span><i class="legend-color white"></i>не відвідана</span>
        <span><i class="legend-color yellow"></i>в черзі/стеку</span>
        <span><i class="legend-color green"></i>оброблена</span>
        <span><i class="legend-color blue"></i>поточна</span>
        <span><i class="legend-color orange"></i>ребра дерева</span>
      </div>
      <canvas id="graph" width="900" height="600"></canvas>
    </div>

    <div class="matrix-section">
      <h2>Матриця суміжності</h2>
      <div id="adjMatrix"></div>
    </div>

    <div class="protocol-section">
      <h2>Протокол обходу</h2>
      <div id="protocol"></div>
    </div>

    <div class="results-section">
      <h2>Результати</h2>
      <div class="result-block">
        <h3>BFS</h3>
        <p>Порядок: <span id="bfsOrder"></span></p>
        <p>Дерево обходу: <span id="bfsTree"></span></p>
      </div>
      <div class="result-block">
        <h3>DFS</h3>
        <p>Порядок: <span id="dfsOrder"></span></p>
        <p>Дерево обходу: <span id="dfsTree"></span></p>
      </div>
    </div>
  </div>

  <script type="module" src="./mainContent.js"></script>

</body>

</html>
